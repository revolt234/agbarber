name: prenotazionibarbiere
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.48+63

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  firebase_remote_config: ^6.5.3
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  cloud_functions: ^6.3.3
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0 # Aggiungi questa linea

flutter:
  uses-material-design: true
  assets:
    - assets/A di barber.png
    - assets/logoGerry.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logoGerry.png"
  # Parametri corretti per la versione 0.14.x (Forziamo il tuo colore verde per la Home):
  adaptive_icon_background: "#164638"
  adaptive_icon_foreground: "assets/logoGerry.png"

flutter_native_splash:
  color: "#F4F6F5"          # Colore di sfondo per il tema chiaro (agVerde o grigio chiaro)
  color_dark: "#101715"     # Colore di sfondo nativo per il tema scuro (il tuo scaffoldBackgroundColor dark)

  # Opzionale: se vuoi mostrare anche il logo al centro durante il caricamento nativo
  image: assets/A di barber.png
  image_dark: assets/A di barber.png

  fullscreen: true